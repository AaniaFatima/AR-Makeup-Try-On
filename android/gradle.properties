# --- Memory settings (build crash fix: JVM could not get native memory) ---
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx768m

android.useAndroidX=true
# Jetifier ko false kar dein kyunki ye RAM bohot khata hai aur ab iski zaroorat nahi
android.enableJetifier=false

# --- THE FIX STARTS HERE ---
# Ye lines Kotlin compiler ko drives ke darmiyan confuse hone se rokengi
kotlin.incremental=false
kotlin.incremental.jvm=false
kotlin.incremental.js=false
# ---------------------------

# Force specific Kotlin version to resolve conflicts
kotlin.version=2.1.0

# AndroidX checks bypass
android.experimental.allowVisibleToOutside=true